<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuxeFolio — Premium Portfolio Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Playfair Display', 'serif'],
          },
          colors: {
            luxury: {
              50: '#f8f7f4',
              100: '#f0ede6',
              200: '#e0d9cc',
              300: '#c9bba3',
              400: '#b09a7a',
              500: '#9a8160',
              600: '#8a6f52',
              700: '#735a45',
              800: '#5f4b3c',
              900: '#4f3f34',
              950: '#2a211a',
            },
            gold: {
              400: '#d4af37',
              500: '#c9a227',
              600: '#b8860b',
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-display {
      font-family: 'Playfair Display', serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .dark .glass {
      background: rgba(15, 23, 42, 0.75);
    }
    .preview-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .preview-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .preview-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .dark .preview-scroll::-webkit-scrollbar-thumb {
      background: #475569;
    }
    .skill-tag {
      transition: all 0.2s ease;
    }
    .skill-tag:hover {
      transform: translateY(-1px);
    }
    .project-card {
      transition: all 0.25s ease;
    }
    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .fade-in {
      animation: fadeIn 0.4s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    }
    .btn-gold {
      background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
      color: #1a1a1a;
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, #c9a227 0%, #a67c00 100%);
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .theme-indigo { --accent: #6366f1; --accent-hover: #4f46e5; }
    .theme-violet { --accent: #8b5cf6; --accent-hover: #7c3aed; }
    .theme-emerald { --accent: #10b981; --accent-hover: #059669; }
    .theme-rose { --accent: #f43f5e; --accent-hover: #e11d48; }
    .theme-amber { --accent: #f59e0b; --accent-hover: #d97706; }
    .theme-gold { --accent: #d4af37; --accent-hover: #b8860b; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">

  <!-- Top Navigation -->
  <nav class="sticky top-0 z-50 glass border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
            <i class="fas fa-gem text-white text-sm"></i>
          </div>
          <div>
            <h1 class="font-display text-xl font-semibold tracking-tight">LuxeFolio</h1>
            <p class="text-[10px] uppercase tracking-widest text-slate-500 dark:text-slate-400 -mt-0.5">Premium Portfolio Generator</p>
          </div>
        </div>
        <div class="flex items-center gap-2 sm:gap-3">
          <button onclick="toggleTheme()" class="p-2.5 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition" title="Toggle dark mode">
            <i class="fas fa-moon dark:hidden text-slate-600"></i>
            <i class="fas fa-sun hidden dark:inline text-amber-400"></i>
          </button>
          <button onclick="loadSample()" class="hidden sm:flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition">
            <i class="fas fa-magic text-indigo-500"></i> Sample
          </button>
          <button onclick="saveData()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
            <i class="fas fa-save"></i> <span class="hidden sm:inline">Save</span>
          </button>
          <button onclick="downloadPortfolio()" class="flex items-center gap-2 px-4 py-2 text-sm font-semibold rounded-xl btn-primary text-white shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 transition">
            <i class="fas fa-download"></i> <span class="hidden sm:inline">Download</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-6 lg:py-8">
    <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 lg:gap-8">

      <!-- ========== FORM PANEL ========== -->
      <div class="xl:col-span-5 space-y-6">

        <!-- Personal Info -->
        <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex items-center gap-2 mb-5">
            <div class="w-8 h-8 rounded-lg bg-indigo-100 dark:bg-indigo-900/40 flex items-center justify-center">
              <i class="fas fa-user text-indigo-600 dark:text-indigo-400 text-sm"></i>
            </div>
            <h2 class="font-semibold text-lg">Personal Info</h2>
          </div>
          <div class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Full Name *</label>
                <input type="text" id="name" placeholder="Alex Rivera" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Job Title *</label>
                <input type="text" id="title" placeholder="Full-Stack Developer" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Location</label>
                <input type="text" id="location" placeholder="San Francisco, CA" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Email</label>
                <input type="email" id="email" placeholder="alex@example.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Avatar URL (optional)</label>
              <input type="url" id="avatar" placeholder="https://..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
            </div>
          </div>
        </section>

        <!-- About / Bio -->
        <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-violet-100 dark:bg-violet-900/40 flex items-center justify-center">
                <i class="fas fa-pen-fancy text-violet-600 dark:text-violet-400 text-sm"></i>
              </div>
              <h2 class="font-semibold text-lg">About Me</h2>
            </div>
            <button onclick="generateBio()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-gradient-to-r from-violet-500 to-indigo-500 text-white hover:from-violet-600 hover:to-indigo-600 transition shadow-sm">
              <i class="fas fa-sparkles"></i> Generate Bio
            </button>
          </div>
          <textarea id="bio" rows="5" placeholder="Write a short professional bio or click Generate Bio..." class="w-full px-3.5 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm resize-none" oninput="updatePreview()"></textarea>
          <p class="text-[11px] text-slate-400 mt-2">Tip: Fill name, title & skills first, then generate a polished bio.</p>
        </section>

        <!-- Skills & Languages -->
        <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex items-center gap-2 mb-5">
            <div class="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-emerald-900/40 flex items-center justify-center">
              <i class="fas fa-code text-emerald-600 dark:text-emerald-400 text-sm"></i>
            </div>
            <h2 class="font-semibold text-lg">Skills & Languages</h2>
          </div>

          <div class="mb-4">
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Programming Languages</label>
            <div class="flex flex-wrap gap-2 mb-2" id="langTags"></div>
            <div class="flex gap-2">
              <input type="text" id="langInput" placeholder="e.g. Python, JavaScript, TypeScript..." class="flex-1 px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" onkeydown="if(event.key==='Enter'){event.preventDefault();addLanguage()}" />
              <button onclick="addLanguage()" class="px-3 py-2 rounded-xl bg-emerald-500 text-white text-sm font-medium hover:bg-emerald-600 transition">
                <i class="fas fa-plus"></i>
              </button>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-2">
              <button onclick="quickAddLang('Python')" class="text-[11px] px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">+ Python</button>
              <button onclick="quickAddLang('JavaScript')" class="text-[11px] px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">+ JavaScript</button>
              <button onclick="quickAddLang('TypeScript')" class="text-[11px] px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">+ TypeScript</button>
              <button onclick="quickAddLang('Java')" class="text-[11px] px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">+ Java</button>
              <button onclick="quickAddLang('Go')" class="text-[11px] px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">+ Go</button>
              <button onclick="quickAddLang('Rust')" class="text-[11px] px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">+ Rust</button>
              <button onclick="quickAddLang('C++')" class="text-[11px] px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">+ C++</button>
              <button onclick="quickAddLang('SQL')" class="text-[11px] px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">+ SQL</button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">Other Skills & Tools</label>
            <div class="flex flex-wrap gap-2 mb-2" id="skillTags"></div>
            <div class="flex gap-2">
              <input type="text" id="skillInput" placeholder="e.g. React, Node.js, Docker, AWS..." class="flex-1 px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" onkeydown="if(event.key==='Enter'){event.preventDefault();addSkill()}" />
              <button onclick="addSkill()" class="px-3 py-2 rounded-xl bg-indigo-500 text-white text-sm font-medium hover:bg-indigo-600 transition">
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
        </section>

        <!-- Projects -->
        <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-amber-100 dark:bg-amber-900/40 flex items-center justify-center">
                <i class="fas fa-folder-open text-amber-600 dark:text-amber-400 text-sm"></i>
              </div>
              <h2 class="font-semibold text-lg">Projects</h2>
            </div>
            <button onclick="addProject()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-white hover:bg-amber-600 transition">
              <i class="fas fa-plus"></i> Add Project
            </button>
          </div>
          <div id="projectsContainer" class="space-y-4"></div>
        </section>

        <!-- Experience -->
        <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex items-center justify-between mb-5">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-rose-100 dark:bg-rose-900/40 flex items-center justify-center">
                <i class="fas fa-briefcase text-rose-600 dark:text-rose-400 text-sm"></i>
              </div>
              <h2 class="font-semibold text-lg">Experience</h2>
            </div>
            <button onclick="addExperience()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-rose-500 text-white hover:bg-rose-600 transition">
              <i class="fas fa-plus"></i> Add
            </button>
          </div>
          <div id="experienceContainer" class="space-y-4"></div>
        </section>

        <!-- Social Links -->
        <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex items-center gap-2 mb-5">
            <div class="w-8 h-8 rounded-lg bg-sky-100 dark:bg-sky-900/40 flex items-center justify-center">
              <i class="fas fa-share-nodes text-sky-600 dark:text-sky-400 text-sm"></i>
            </div>
            <h2 class="font-semibold text-lg">Social Links</h2>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="flex items-center gap-2">
              <i class="fab fa-github w-5 text-slate-500"></i>
              <input type="url" id="github" placeholder="GitHub URL" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
            </div>
            <div class="flex items-center gap-2">
              <i class="fab fa-linkedin w-5 text-slate-500"></i>
              <input type="url" id="linkedin" placeholder="LinkedIn URL" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
            </div>
            <div class="flex items-center gap-2">
              <i class="fab fa-twitter w-5 text-slate-500"></i>
              <input type="url" id="twitter" placeholder="X / Twitter URL" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
            </div>
            <div class="flex items-center gap-2">
              <i class="fab fa-instagram w-5 text-slate-500"></i>
              <input type="url" id="instagram" placeholder="Instagram URL" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
            </div>
            <div class="flex items-center gap-2">
              <i class="fab fa-youtube w-5 text-slate-500"></i>
              <input type="url" id="youtube" placeholder="YouTube URL" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
            </div>
            <div class="flex items-center gap-2">
              <i class="fas fa-globe w-5 text-slate-500"></i>
              <input type="url" id="website" placeholder="Personal Website" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" oninput="updatePreview()" />
            </div>
          </div>
        </section>

        <!-- Theme -->
        <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-sm">
          <div class="flex items-center gap-2 mb-5">
            <div class="w-8 h-8 rounded-lg bg-fuchsia-100 dark:bg-fuchsia-900/40 flex items-center justify-center">
              <i class="fas fa-palette text-fuchsia-600 dark:text-fuchsia-400 text-sm"></i>
            </div>
            <h2 class="font-semibold text-lg">Theme & Style</h2>
          </div>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">Accent Color</label>
              <div class="flex flex-wrap gap-2">
                <button onclick="setAccent('indigo')" class="w-8 h-8 rounded-full bg-indigo-500 ring-2 ring-offset-2 ring-offset-white dark:ring-offset-slate-900 ring-indigo-500" title="Indigo"></button>
                <button onclick="setAccent('violet')" class="w-8 h-8 rounded-full bg-violet-500" title="Violet"></button>
                <button onclick="setAccent('emerald')" class="w-8 h-8 rounded-full bg-emerald-500" title="Emerald"></button>
                <button onclick="setAccent('rose')" class="w-8 h-8 rounded-full bg-rose-500" title="Rose"></button>
                <button onclick="setAccent('amber')" class="w-8 h-8 rounded-full bg-amber-500" title="Amber"></button>
                <button onclick="setAccent('gold')" class="w-8 h-8 rounded-full bg-gradient-to-br from-yellow-400 to-amber-600" title="Gold (Luxury)"></button>
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">Portfolio Style</label>
              <select id="style" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm" onchange="updatePreview()">
                <option value="modern">Modern & Clean</option>
                <option value="luxury">Luxury / Elegant</option>
                <option value="minimal">Minimal</option>
                <option value="bold">Bold & Vibrant</option>
              </select>
            </div>
          </div>
        </section>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-3">
          <button onclick="downloadPortfolio()" class="flex-1 flex items-center justify-center gap-2 px-5 py-3.5 rounded-xl btn-primary text-white font-semibold shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 transition">
            <i class="fas fa-file-code"></i> Download Portfolio HTML
          </button>
          <button onclick="resetAll()" class="px-5 py-3.5 rounded-xl border border-slate-300 dark:border-slate-700 font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            Reset
          </button>
        </div>
      </div>

      <!-- ========== LIVE PREVIEW ========== -->
      <div class="xl:col-span-7">
        <div class="sticky top-24">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-medium text-slate-500 dark:text-slate-400 flex items-center gap-2">
              <i class="fas fa-eye"></i> Live Preview
            </h3>
            <div class="flex items-center gap-1 bg-slate-200 dark:bg-slate-800 rounded-lg p-1">
              <button onclick="setPreviewMode('desktop')" id="btnDesktop" class="px-3 py-1 text-xs rounded-md bg-white dark:bg-slate-700 shadow-sm font-medium">Desktop</button>
              <button onclick="setPreviewMode('mobile')" id="btnMobile" class="px-3 py-1 text-xs rounded-md text-slate-500">Mobile</button>
            </div>
          </div>
          <div id="previewWrapper" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xl overflow-hidden transition-all duration-300">
            <div id="previewContent" class="preview-scroll overflow-y-auto max-h-[calc(100vh-140px)]">
              <!-- Preview rendered here -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 px-5 py-3 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-sm font-medium shadow-2xl opacity-0 translate-y-4 transition-all duration-300 pointer-events-none z-50">
    Saved successfully
  </div>

  <script>
    // ========== STATE ==========
    let languages = [];
    let skills = [];
    let projects = [];
    let experiences = [];
    let currentAccent = 'indigo';
    let previewMode = 'desktop';

    // ========== INIT ==========
    document.addEventListener('DOMContentLoaded', () => {
      // Dark mode preference
      if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      loadData();
      if (projects.length === 0) addProject();
      if (experiences.length === 0) addExperience();
      updatePreview();
    });

    // ========== THEME ==========
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    function setAccent(color) {
      currentAccent = color;
      document.querySelectorAll('[onclick^="setAccent"]').forEach(btn => {
        btn.classList.remove('ring-2', 'ring-offset-2', 'ring-offset-white', 'dark:ring-offset-slate-900');
      });
      event.currentTarget.classList.add('ring-2', 'ring-offset-2', 'ring-offset-white', 'dark:ring-offset-slate-900');
      if (color === 'indigo') event.currentTarget.classList.add('ring-indigo-500');
      else if (color === 'violet') event.currentTarget.classList.add('ring-violet-500');
      else if (color === 'emerald') event.currentTarget.classList.add('ring-emerald-500');
      else if (color === 'rose') event.currentTarget.classList.add('ring-rose-500');
      else if (color === 'amber') event.currentTarget.classList.add('ring-amber-500');
      else if (color === 'gold') event.currentTarget.classList.add('ring-amber-400');
      updatePreview();
    }

      const langs = languages.length ? languages.slice(0, 4).join(', ') : 'modern technologies';

      const templates = [
        `I'm ${name}, a ${title}${location ? ` based in ${location}` : ''}. I specialize in ${langs} and love crafting elegant, high-performance applications. With a strong focus on ${skillList}, I turn complex problems into clean, scalable solutions that users enjoy.`,

    function saveData() {
      localStorage.setItem('luxefolio_data', JSON.stringify(getFormData()));

    function loadData() {
      const raw = localStorage.getItem('luxefolio_data');
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        document.getElementById('name').value = data.name || '';
        document.getElementById('title').value = data.title || '';
        document.getElementById('location').value = data.location || '';

    // ========== DOWNLOAD ==========
    function downloadPortfolio() {
      const data = getFormData();
      const name = data.name || 'Portfolio';
      const accent = getAccentClasses();
      const isLuxury = data.style === 'luxury';

      // Build a complete standalone HTML
      const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${escapeHtml(name)} — Portfolio</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Playfair Display', 'serif'] } } }
    }
  <\/script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Playfair Display', serif; }
    .project-card { transition: all 0.25s ease; }
    .project-card:hover { transform: translateY(-4px); }
  </style>
</head>
<body class="${isLuxury ? 'bg-slate-950 text-slate-100' : 'bg-white text-slate-800'}">
  ${document.getElementById('previewContent').innerHTML}
  <script>
    // Optional: respect system dark mode for non-luxury
    if (!${isLuxury} && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark:bg-slate-900', 'dark:text-slate-100');
    }
  <\/script>
</body>
</html>`;

      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(name || 'portfolio').toLowerCase().replace(/\s+/g, '-')}-portfolio.html`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Portfolio downloaded!');
    }

    // ========== UTILS ==========
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('opacity-0', 'translate-y-4');
      t.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        t.classList.add('opacity-0', 'translate-y-4');
        t.classList.remove('opacity-100', 'translate-y-0');
      }, 2500);
    }
  </script>
</body>
